name: SPARK External Runtime Bridge

on:
  pull_request:
    paths:
      - "runtime/external-spark-v1.js"
      - "tests/external-spark-loader-v1.test.js"
      - "scripts/serve_external_spark_runtime.mjs"
      - "scripts/qualify_spark_runtime.mjs"
      - "scripts/validate_v534.js"
      - "docs/V5_34_SPARK_EXTERNAL_RUNTIME_BRIDGE.md"
      - "package.json"
      - ".github/workflows/spark-runtime-bridge.yml"
  push:
    branches:
      - main
    paths:
      - "runtime/external-spark-v1.js"
      - "tests/external-spark-loader-v1.test.js"
      - "scripts/serve_external_spark_runtime.mjs"
      - "scripts/qualify_spark_runtime.mjs"
      - "scripts/validate_v534.js"
      - "docs/V5_34_SPARK_EXTERNAL_RUNTIME_BRIDGE.md"
      - "package.json"
      - ".github/workflows/spark-runtime-bridge.yml"

jobs:
  qualify:
    name: runtime / PixelForge SPARK loader qualification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PixelForge
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate:v5.34
      - name: Private cross-repo note
        run: |
          echo "SPARK is private, so the default PixelForge GITHUB_TOKEN cannot checkout it."
          echo "The exact cross-repository qualification runs from the private SparkTheSubstrate repository, which can checkout public PixelForge without a PAT."
